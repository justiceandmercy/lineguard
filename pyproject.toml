[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lineguard"
version = "0.1.0"
description = "Enforce maximum line length and forbid trailing whitespace."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
lineguard = "lineguard.cli:main"